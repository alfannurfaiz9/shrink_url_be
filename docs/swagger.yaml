basePath: /
definitions:
  dto.ErrorResponse:
    properties:
      message:
        example: internal server error
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.Register:
    properties:
      email:
        example: alexwalker@mail.com
        type: string
      full_name:
        example: Alex Walker
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: alex123
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.Response:
    properties:
      message:
        example: successfully get data
        type: string
      result: {}
      success:
        example: true
        type: boolean
    type: object
host: localhost:9000
info:
  contact: {}
  description: API docs for ShrinkURL
  title: ShrinkURL Backend
  version: "1.0"
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account with email, full name, and password
      parameters:
      - description: Register Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
securityDefinitions:
  BearerToken:
    description: Bearer Token used as identity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
